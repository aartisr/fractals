[tool.setuptools]
include-package-data = true
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-workspace"
version = "0.1.20"
description = "Interactive fractal generator and box counting analysis toolkit."
authors = [
    { name = "Aarti S Ravikumar", email = "aaravikumar@pioneercss.org" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "PyQt6",
    "opencv-python==4.10.0.84",
    "scikit-image==0.24.0",
    "markdown",
    "pytest"
    ,"onnxruntime"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["fractals*", "boxcounting*", "tumors*", "ui*", "wiki*", "images*"]
exclude = ["tests*", "scripts*", "yolov5*"]


[tool.setuptools.package-data]
"images.boxcounter" = ["*"]
"tumors" = ["*"]
"tumors.originals" = ["*"]
"images" = ["*"]


[project.scripts]
fractal-workspace = "ui:main"
fractals-download-models = "fractals.download_models:main"
