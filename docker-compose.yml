# Nithyananda TV - Master Orchestration File
# This file includes all services for the complete stack
# Usage: docker-compose up -d
#
# Or use individual service files:
#   docker-compose -f docker-compose-postgres.yml up -d
#   docker-compose -f docker-compose-cms.yml up -d
#   docker-compose -f docker-compose-web.yml up -d
#   etc.

include:
  - docker-compose-postgres.yml
  - docker-compose-cms.yml
  - docker-compose-web.yml
  - docker-compose-chat-service.yml
  - docker-compose-live-transcoder.yml
  - docker-compose-live-translation-api.yml
  - docker-compose-live-transcription-worker.yml

# Global volumes (referenced by individual compose files)
volumes:
  pgdata:
  cms_media:
  transcoder_temp:
  transcoder_logs:
  chat_logs:
  analysis_data:

# Global network (must be created before running: docker network create nithyananda-tv-network)
networks:
  nithyananda-tv-network:
    external: true
