# Live Transcription Worker Service
# Usage: docker-compose -f docker-compose.live-transcription-worker.yml up -d
# Note: Requires postgres, cms-migrate, and live-transcoder to be running

services:
  live-transcription-worker:
    build:
      context: ./live_translation
      dockerfile: Dockerfile
    container_name: ntv-live-translation-transcription
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://${DB_USER:-ntv}:${DB_PASSWORD}@postgres:5432/${DATABASE:-nithyananda-tv}?sslmode=disable
    volumes:
      - analysis_data:/analysis
    command: ["live-translation-transcription"]
    restart: unless-stopped
    networks:
      - nithyananda-tv-network

volumes:
  analysis_data:
    driver: local

networks:
  nithyananda-tv-network:
    external: true
